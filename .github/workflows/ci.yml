name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: "${{ matrix.os }} — test, format, build"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      - name: Format check (Prettier)
        run: bun run format:check

      - name: Build dist
        run: bun run build
