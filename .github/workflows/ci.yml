name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (PR pushes, rapid merges).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Single source for the Bun toolchain. Keep in sync with
  # scripts/postinstall.js (Bun download version).
  BUN_VERSION: 1.3.14

jobs:
  test:
    name: "${{ matrix.os }} — test, format, lint, typecheck, build"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      - name: Format check (Prettier)
        run: bun run format:check

      - name: Lint (Biome)
        run: bun run lint

      - name: Typecheck (tsc)
        run: bun run typecheck

      - name: Build dist
        run: bun run build

    # All four quality gates run here: tests, format, lint, typecheck.
    # `bun run check` (Prettier + tests) is the local fast path; CI is the
    # full gate. Keep this comment in sync with CONTRIBUTING.md.
