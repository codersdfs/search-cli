name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run build

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run build
      # Standalone self-contained binaries (no Node/Bun needed) for
      # Homebrew / Scoop / winget / curl-script installs.
      - name: Compile standalone binary
        shell: bash
        run: |
          os="${{ runner.os }}"
          arch="${{ runner.arch }}"
          case "$os" in
            Linux)   plat="linux" ;;
            macOS)   plat="darwin" ;;
            Windows) plat="win32" ;;
          esac
          name="ghfind-${plat}-${arch}"
          version="$(node -p "require('./package.json').version")"
          if [ "$os" = "Windows" ]; then
            name="${name}.exe"
          fi
          # Single-quoted value is a valid JS string literal for bun's --define
          bun build --compile --minify src/cli.ts --outfile "$name" --define "__GHFIND_VERSION__='$version'"
      - uses: actions/upload-artifact@v4
        with:
          name: ghfind-${{ matrix.os }}
          path: dist/
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            ghfind-*
          generate_release_notes: true

  publish-npm:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
